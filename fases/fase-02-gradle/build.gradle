plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

application {
    mainClass = 'missaomarte.Main'
}

run {
    // Sem isso o teclado não chega ao jogo quando ele roda pelo Gradle.
    standardInput = System.in
}

